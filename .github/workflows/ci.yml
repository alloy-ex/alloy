name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "28.5.0.7"

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - elixir: "1.20.4"
            otp: "28.5.0.7"
            lint: true
            docs: true
          - elixir: "1.19.6"
            otp: "27"
            lint: true
          - elixir: "1.20.4"
            otp: "29"
            lint: false
          # Floor leg: mix.exs promises ~> 1.17, so compile + test it.
          # Lint/format/dialyzer stay on the modern legs — formatter output
          # and warning sets differ across Elixir versions.
          - elixir: "1.17"
            otp: "26"
            lint: false

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Cache PLT
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      # Lint legs run every gate through the same alias contributors use
      # locally (see `aliases/0` in mix.exs), so CI and `mix ci` can't drift.
      - run: mix ci
        if: ${{ matrix.lint }}

      - run: mix compile
        if: ${{ !matrix.lint }}
      - run: mix test
        if: ${{ !matrix.lint }}

      - name: Docs build without warnings
        if: ${{ matrix.docs }}
        run: MIX_ENV=dev mix docs --warnings-as-errors
