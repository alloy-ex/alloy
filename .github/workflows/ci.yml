name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "28"

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - elixir: "1.20"
            otp: "28"
            lint: true
          - elixir: "1.19"
            otp: "27"
            lint: true
          # Floor leg: mix.exs promises ~> 1.17, so compile + test it.
          # Lint/format/dialyzer stay on the modern legs — formatter output
          # and warning sets differ across Elixir versions.
          - elixir: "1.17"
            otp: "26"
            lint: false

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Cache PLT
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}
      - run: mix compile
        if: ${{ !matrix.lint }}
      - run: mix test
      - run: mix format --check-formatted
        if: ${{ matrix.lint }}
      - run: mix credo --strict
        if: ${{ matrix.lint }}
      - run: mix dialyzer
        if: ${{ matrix.lint }}
